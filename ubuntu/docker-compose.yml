########################### NETWORKS
networks:
  wan:
    name: wan
    driver: bridge

  itflow-db:
    name: itflow-db
    external: false

########################### VOLUMES

volumes:
  itflow-db:

########################### ITFLOW
services:
  itflow:
    platform: linux/amd64
    hostname: itflow
    container_name: itflow
    # Comment out image for DockerHub image, use build for local DockerFile if you prefer to build from base
    image: itfloworg/itflow
    #build: 
      #context: .
      #dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: 
      - itflow-db
    networks:
      - wan
      - itflow-db
    ports:
      - "9080:8082"
    environment:
      - TZ=$TZ
      - ITFLOW_NAME=ITFlow
      - ITFLOW_URL=helpdesk.venvietech.co.ke
      - ITFLOW_PORT=8082
      - ITFLOW_REPO=github.com/itflow-org/itflow
      - ITFLOW_REPO_BRANCH=master
      - ITFLOW_LOG_LEVEL=info
      - ITFLOW_DB_HOST=itflow
      - ITFLOW_DB_PASS=Trexzen@1
    volumes:
      - ./itflow/:/var/www/html

  itflow-db:
    hostname: itflow
    container_name: itflow
    image: mariadb:10.6.11
    restart: always
    networks:
      - itflow-db
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_DATABASE=itflow
      - MARIADB_USER=itflow
      - MARIADB_PASSWORD=Trexzen@1
    volumes:
      - itflow-db:/var/lib/mysql/    
